<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="256" height="256" fill="url(#moon-grad) #3CFF7A" role="img" aria-label="moon.cx">
  <title>moon.cx</title>
  <!-- ЛОГОТИП moon.cx (знак без надписи).

       Отличие от favicon.svg: тот файл предназначен браузерной вкладке и
       намеренно без width/height, чтобы масштабироваться под любой слот.
       Здесь width/height заданы (256) — это ассет для ВНЕШНЕГО употребления:
       пресс-киты, соцсети, растеризация в PNG. Без явных размеров многие
       конвертеры и редакторы берут дефолт 100x100 и режут качество.

       Контур — тот же, что у MoonGlyph в шапке (src/components/shared.jsx) и
       у favicon.svg: единый источник формы, три файла не должны разъезжаться.
       С появлением градиента они синхронизируют ещё и заливку — три стопа
       ниже обязаны совпадать во всех трёх местах.

       ЗАЛИВКА. Свет падает из левого-нижнего угла: толстое брюхо полумесяца
       горит фирменным акцентом #3CFF7A (CSS-переменная accent в
       src/styles/styles.css), рога и оба круга уходят по диагонали
       вверх-вправо в холодную тень #1FB8A6. Ось задана формой, а не вкусом:
       рога серпа всегда отвёрнуты от источника света, поэтому источник внизу
       слева, а вогнутая кромка — терминатор. Проекции обоих кончиков рога на
       эту ось совпадают, и серп гаснет симметрично.

       ПЛОСКИЙ #3CFF7A — ОФИЦИАЛЬНЫЙ МОНОХРОМНЫЙ ФОЛБЭК, а не устаревшая
       версия. Он стоит вторым значением в fill: это штатный механизм SVG —
       если ссылка на градиент не разрешилась, берётся следующий цвет. Без
       него знак рисовался бы как fill:none, то есть пропадал целиком.

       ЭТОТ ФАЙЛ — ИСТОЧНИК ОБОИХ PNG. favicon-32.png и tonconnect-icon.png
       получены растеризацией именно его, поэтому заливка у всех четырёх
       поверхностей одна. Правя градиент здесь, перерисуйте и PNG, иначе
       вкладка браузера и модалка кошелька разойдутся с шапкой приложения.

       Фон ПРОЗРАЧНЫЙ: знак рассчитан на тёмную подложку #0A0A0A, но не несёт
       её в себе.

       ВАЖНО: внутри XML-комментария нельзя писать двойной дефис. -->
  <defs>
    <!-- userSpaceOnUse обязателен: по умолчанию градиент считается по
         границам КАЖДОЙ фигуры, и круг радиусом 1.5 прогонял бы всю рампу на
         своих трёх пикселях. Здесь три фигуры стоят в одном световом поле. -->
    <linearGradient id="moon-grad" gradientUnits="userSpaceOnUse" x1="3.8" y1="22.2" x2="21.8" y2="4.2">
      <stop offset="0" stop-color="#3CFF7A"/>
      <stop offset="0.45" stop-color="#35ED85"/>
      <stop offset="1" stop-color="#1FB8A6"/>
    </linearGradient>
  </defs>
  <path d="M12.9999 25.9999C20.1796 25.9999 25.9998 20.1797 25.9998 13C25.9998 12.3985 25.0983 12.2991 24.7872 12.8139C21.5812 18.1197 13.9041 19.5936 10 15.5C5.5 10.7815 7.68951 4.53401 13.186 1.2127C13.7008 0.901624 13.6014 0.00012207 12.9999 0.00012207C5.82026 0.00012207 0 5.82038 0 13C0 20.1797 5.82026 25.9999 12.9999 25.9999Z" />
  <circle cx="14.2872" cy="11.5" r="1.5" />
  <circle cx="19.2872" cy="6.5" r="3.5" />
</svg>
